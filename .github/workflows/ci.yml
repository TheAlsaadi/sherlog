name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET (LTS)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Validate recipes against the schema
        shell: pwsh
        run: |
          $schema = 'library/schema/recipe.schema.json'
          $recipes = @(Get-ChildItem -Path library/recipes -Filter *.yaml -ErrorAction SilentlyContinue)
          if (-not (Test-Path $schema)) {
            Write-Host "No recipe schema yet ($schema); skipping recipe validation."
            exit 0
          }
          if ($recipes.Count -eq 0) {
            Write-Host 'No recipes to validate.'
            exit 0
          }
          pipx run check-jsonschema --schemafile $schema $recipes.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Build the seeded-crash programs (tests/seeded) and keep them as an artifact. GitHub's runner images never log
  # crash events (checked: zero Application Error 1000 / WER 1001 events), so the crashes themselves run in Windows
  # Sandbox instead: sandbox/README.md, ADR 0007.
  seeded-programs:
    name: seeded programs
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the seeded programs
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call tests\seeded\build.cmd

      - name: Keep the seeded programs
        uses: actions/upload-artifact@v4
        with:
          name: seeded-programs
          path: tests/seeded/bin/
          if-no-files-found: error

  # The field-test kit (docs/field-test.md): one self-contained sherlog.exe with the recipe library next to it,
  # so a friend can unzip it and double-click without installing .NET. Not trimmed. Unsigned until Phase 5.
  package:
    name: package
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET (LTS)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish sherlog.exe
        run: dotnet publish src/Sherlog.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Check the published exe finds its library
        shell: pwsh
        run: |
          ./publish/sherlog.exe recipes check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the field-test kit
        uses: actions/upload-artifact@v4
        with:
          name: sherlog-field-test
          path: |
            publish/sherlog.exe
            publish/library/
          if-no-files-found: error
