name: Bug report
description: Something in Sherlog didn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste crash dumps, raw event logs, your user name, PC name or file paths from your user folder**. If evidence helps, attach a bundle made with `sherlog collect --redact`.
        For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did Sherlog do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `sherlog explain --latest`
        2. ...
  - type: input
    id: version
    attributes:
      label: Sherlog version
      placeholder: e.g. 0.1.0, or a commit hash
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data (user names, PC names, user-folder paths) from this report
          required: true
