# Test recipe for a seeded crash (tests/seeded). Not part of the user-facing library.
id: seed-fastfail
version: 1
title: "Seeded test crash: the program ended itself with a fast-fail check"
category: crash
references:
  - https://learn.microsoft.com/en-us/windows/win32/debug/structured-exception-handling
match:
  any:
    - source: application-error
      app_name: SherlogSeedFastFail.exe
      faulting_module: SherlogSeedFastFail.exe
      exception_code: "0xc0000409"
confidence:
  default: likely
diagnosis:
  summary: "Seeded test crash: the program ended itself with a fast-fail check (this only happens in Sherlog's own tests)."
examples:
  - source: application-error
    app_name: SherlogSeedFastFail.exe
    faulting_module: SherlogSeedFastFail.exe
    exception_code: "0xc0000409"
