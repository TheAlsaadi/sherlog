id: gpu-intel-driver-dll-crash
version: 1
title: App or game crashed inside an Intel graphics driver file
category: crash
references:
  - https://www.intel.com/content/www/us/en/support/articles/000005482/graphics.html

# User-mode Intel driver files seen in crash reports: igd10iumd64.dll / igd10iumd32.dll and
# igd10umt64xe.dll (Direct3D 11), igd12umd64.dll and igd12um64xel.dll / igd12um64xeh.dll /
# igd12um64xe2.dll (Direct3D 12, Arc/Xe), igdumdim64.dll (Direct3D 9), ig9icd64.dll / ig75icd64.dll /
# igxelpicd64.dll / igxelpgicd64.dll (OpenGL), igvk64.dll (Vulkan). UNCLEAR for the same reasons as the
# NVIDIA and AMD recipes; Intel's own advice starts with updating the driver and checking the app.
match:
  any:
    - source: application-error
      faulting_module: igd10*.dll
    - source: application-error
      faulting_module: igd12*.dll
    - source: application-error
      faulting_module: igdumd*.dll
    - source: application-error
      faulting_module: ig*icd64.dll
    - source: application-error
      faulting_module: ig*icd32.dll
    - source: application-error
      faulting_module: igvk*.dll

confidence:
  default: unclear

diagnosis:
  summary: "The app crashed inside your Intel graphics driver. This is often, but not always, a driver problem: the app itself can cause it too."
  details: "The graphics driver runs inside every game and many apps, so it is where many graphics crashes end up. An old driver, a bug in a new driver, the app itself or overheating can all cause it. If only one app crashes, the app or driver is more likely; if many do, the driver or hardware is."

fixes:
  - id: update-intel-graphics-driver
    risk: safe
    explain: "Get the newest graphics driver, first from your PC maker and otherwise from Intel. Intel recommends this first for graphics crashes."
    actions:
      - action: open_url
        params: { url: "https://www.intel.com/content/www/us/en/support/detect.html" }
  - id: rollback-recent-display-driver
    risk: moderate
    when:
      change_timeline: { kind: driver_update, device_class: Display, within_days: 14 }
    explain: "Your graphics driver was updated recently. If the crashes started after that, going back to the previous version may stop them."
    actions:
      - action: rollback_driver
        params: { device_class: Display }
    verify:
      no_recurrence_days: 7
  - id: verify-game-files
    risk: safe
    explain: "If only one game crashes, ask its launcher to check and repair the game's files."
    actions:
      - action: verify_game_files

examples:
  - source: application-error
    app_name: Game.exe
    faulting_module: igd10iumd64.dll
    exception_code: "0xc0000005"
  - source: application-error
    app_name: Game-Win64-Shipping.exe
    faulting_module: igd12umd64.dll
    exception_code: "0xc0000005"
  - source: application-error
    app_name: Game.exe
    faulting_module: igd12um64xel.dll
    exception_code: "0xc0000005"
  - source: application-error
    app_name: Editor.exe
    faulting_module: igxelpicd64.dll
    exception_code: "0xc0000005"
