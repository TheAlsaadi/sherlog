id: bsod-system-service-exception
version: 1
title: Blue screen 0x3B (SYSTEM_SERVICE_EXCEPTION)
category: bluescreen
references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/bug-check-0x3b--system-service-exception
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/performance/stop-code-error-troubleshooting

# The faulting driver (often a graphics driver, per Microsoft's own example) is only in the dump, which
# Sherlog doesn't read. Keep it vendor-neutral and unclear.
match:
  any:
    - source: bugcheck
      bugcheck_code: "0x0000003b"
    - source: kernel-power
      bugcheck_code: "0x0000003b"

confidence:
  default: unclear

diagnosis:
  summary: "Windows stopped with a blue screen because a driver or part of Windows ran into an error. A driver is the most common cause."
  details: "Code 0x3B means code running inside Windows tried to use a bad memory address. Most of the time a driver is to blame, but the record doesn't say which one, and damaged system files or unstable memory can look the same."

fixes:
  - id: install-driver-updates
    risk: safe
    explain: "Install Windows updates, including optional driver updates, and update your graphics driver from its maker's website. If a driver changed just before the blue screens began, that one is the first suspect."
    actions:
      - action: open_settings_page
        params: { uri: "ms-settings:windowsupdate-optionalupdates" }
  - id: test-memory
    risk: safe
    explain: "Run Windows Memory Diagnostic to rule out faulty RAM."
    actions:
      - action: show_guidance
        params: { guide: windows-memory-diagnostic }
  - id: repair-system-files
    risk: moderate
    explain: "Run System File Checker. It finds damaged Windows files and replaces them with good copies."
    actions:
      - action: run_system_check
        params: { check: sfc }

examples:
  - source: bugcheck
    bugcheck_code: "0x0000003b"
  - source: kernel-power
    bugcheck_code: "0x0000003b"
