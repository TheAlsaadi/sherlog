id: gpu-dxgkrnl-fatal-error
version: 1
title: Blue screen 0x113 (VIDEO_DXGKRNL_FATAL_ERROR)
category: bluescreen
references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/bug-check-0x113---video-dxgkrnl-fatal-error
  - https://support.microsoft.com/en-us/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors

# Microsoft only says the DirectX graphics kernel "detected a violation". It does not say who caused it,
# so this stays UNCLEAR and the wording only claims "something in the graphics system".
match:
  any:
    - source: bugcheck
      bugcheck_code: "0x00000113"
    - source: kernel-power
      bugcheck_code: "0x00000113"

confidence:
  default: unclear

diagnosis:
  summary: "The graphics part of Windows found a problem it couldn't recover from. The graphics driver is a possible cause, but this code doesn't say for sure."
  details: "Microsoft only says that Windows' graphics system found something wrong. A graphics driver, a recent Windows or driver update, or a hardware problem can all lead to it."

fixes:
  - id: update-graphics-driver
    risk: safe
    explain: "Install the newest driver for your graphics card from NVIDIA, AMD, Intel or your PC maker."
    actions:
      - action: show_guidance
        params: { guide: update-graphics-driver }
  - id: rollback-recent-display-driver
    risk: moderate
    when:
      change_timeline: { kind: driver_update, device_class: Display, within_days: 14 }
    explain: "Your graphics driver was updated recently. If the blue screens started after that, going back to the previous version may stop them."
    actions:
      - action: rollback_driver
        params: { device_class: Display }
    verify:
      no_recurrence_days: 14
  - id: open-windows-update
    risk: safe
    explain: "Check Windows Update for fixes, since updates also include graphics system and driver fixes."
    actions:
      - action: open_settings_page
        params: { uri: "ms-settings:windowsupdate" }

examples:
  - source: bugcheck
    bugcheck_code: "0x00000113"
  - source: kernel-power
    bugcheck_code: "0x00000113"
