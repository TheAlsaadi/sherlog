id: gpu-video-tdr-failure
version: 1
title: Blue screen 0x116 (VIDEO_TDR_FAILURE)
category: bluescreen
references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/bug-check-0x116---video-tdr-failure
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/display/timeout-detection-and-recovery

# 0x116 is only raised by the graphics timeout-and-recovery system: the driver stopped responding and
# could not be reset in time, or more than five resets happened within a minute. So "the graphics
# driver or card stopped responding" is near-certain. LIKELY rather than more because the stop code
# does not name the vendor (dumps are not read) and does not say WHY: Microsoft lists outdated drivers,
# overclocking, wrong memory settings, cooling, power supply and faulty parts. No confirmed_when:
# repeats make the problem more certain, not its root cause.
match:
  any:
    - source: bugcheck
      bugcheck_code: "0x00000116"
    - source: kernel-power
      bugcheck_code: "0x00000116"

confidence:
  default: likely

diagnosis:
  summary: "Your graphics driver stopped responding and Windows couldn't restart it, so your PC showed a blue screen."
  details: "Windows tries to restart a graphics driver that freezes. When that fails, or it happens many times in a minute, Windows stops with this code. Microsoft lists an outdated driver, an overclock, overheating, a weak power supply or a faulty part as common reasons."

fixes:
  - id: rollback-recent-display-driver
    risk: moderate
    when:
      change_timeline: { kind: driver_update, device_class: Display, within_days: 14 }
    explain: "If your graphics driver was updated just before these blue screens started, going back to the previous version often stops them."
    actions:
      - action: rollback_driver
        params: { device_class: Display }
    verify:
      no_recurrence_days: 14
  - id: check-temperatures
    risk: safe
    explain: "Check that your graphics card's fans spin and that it isn't overheating while you play. Cleaning dust out of the PC can help."
    actions:
      - action: show_guidance
        params: { guide: check-pc-temperatures }
  - id: reset-gpu-tuning
    risk: advanced
    explain: "If you overclocked or undervolted your graphics card, processor or memory, set them back to default and see whether the blue screens stop."
    actions:
      - action: show_guidance
        params: { guide: reset-overclock-and-xmp }

examples:
  - source: bugcheck
    bugcheck_code: "0x00000116"
  - source: kernel-power
    bugcheck_code: "0x00000116"
