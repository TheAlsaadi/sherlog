id: gpu-intel-driver-reset
version: 1
title: Intel graphics driver stopped responding
category: driver-reset
references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/display/timeout-detection-and-recovery
  - https://www.intel.com/content/www/us/en/support/articles/000005482/graphics.html

# Display 4101 service names seen for Intel: igfx (older drivers, quoted in Intel article 000005482),
# igfxn (DCH drivers for UHD/Iris Xe) and igfxnd (Arc / newer Xe drivers). igfx* covers all three.
# igdkmd* (the kernel file names igdkmd64/igdkmdn64/igdkmdnd64) is kept in case a record carries the
# file name instead of the service name. Same reasoning and confidence as gpu-nvidia-driver-reset.
match:
  any:
    - source: display-reset
      faulting_module: igfx*
    - source: display-reset
      faulting_module: igdkmd*

confidence:
  default: likely
  confirmed_when:
    - occurrences_within_days: { count: 3, days: 7 }

diagnosis:
  summary: "Your Intel graphics driver stopped responding, and Windows had to restart it."
  details: "Windows restarts the graphics driver when the graphics chip takes too long to answer. This often follows a driver update, an older driver from your PC maker, or overheating, especially on laptops."

fixes:
  - id: rollback-recent-display-driver
    risk: moderate
    when:
      change_timeline: { kind: driver_update, device_class: Display, within_days: 14 }
    explain: "If your graphics driver was updated just before these resets started, going back to the previous version often stops them."
    actions:
      - action: rollback_driver
        params: { device_class: Display }
    verify:
      no_recurrence_days: 7
  - id: update-intel-graphics-driver
    risk: safe
    explain: "Get the newest graphics driver, first from your PC maker and otherwise from Intel. Intel says this is the first step for this message."
    actions:
      - action: open_url
        params: { url: "https://www.intel.com/content/www/us/en/support/detect.html" }
  - id: check-temperatures
    risk: safe
    explain: "Check that your PC or laptop isn't overheating. Clear dust from the vents and keep a laptop on a hard, flat surface."
    actions:
      - action: show_guidance
        params: { guide: check-pc-temperatures }

examples:
  - source: display-reset
    faulting_module: igfx
  - source: display-reset
    faulting_module: igfxn
  - source: display-reset
    faulting_module: igfxnd
