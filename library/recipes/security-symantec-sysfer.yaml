id: security-symantec-sysfer
version: 1
title: Crash inside Symantec Endpoint Protection Application Control (sysfer.dll)
category: crash
references:
  - https://knowledge.broadcom.com/external/article/151347/applications-crash-after-installing-syma.html
  - https://knowledge.broadcom.com/external/article/181736/how-to-create-an-application-control-exc.html

# sysfer.dll is injected into every launched process by the Application and Device Control feature of
# Symantec Endpoint Protection / Symantec Endpoint Security (business products, not consumer Norton).
# Broadcom says consistent crashes in one app are most likely a conflict with that feature (KB 151347),
# and the fix is an Application Control exception. With the crash inside sysfer.dll itself, Likely.
match:
  any:
    - source: application-error
      faulting_module: sysfer.dll

confidence:
  default: likely

diagnosis:
  summary: "The app crashed inside a file that Symantec Endpoint Protection adds to the apps it watches. A clash with that protection is the likely cause."
  details: "Symantec's Application Control feature loads a helper file into programs as they start. Broadcom, which makes Symantec Endpoint Protection, says some apps don't work properly with it, and repeated crashes in one app are most likely this clash."

fixes:
  - id: ask-it-for-application-control-exception
    risk: safe
    explain: "This protection is usually managed by your company or school. Ask your IT team to update it and add an Application Control exception for just this app. Keep the rest of your protection turned on."
    actions:
      - action: open_url
        params: { url: "https://knowledge.broadcom.com/external/article/181736/how-to-create-an-application-control-exc.html" }

examples:
  - source: application-error
    app_name: Tool.exe
    faulting_module: sysfer.dll
    exception_code: "0xc0000005"
